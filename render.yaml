services:
  # ─── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: ai-resume-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false          # Paste from your backend/.env → GROQ_API_KEY
      - key: CORS_ORIGINS
        sync: false          # Paste frontend URL after frontend deploys
      - key: AUTH_SECRET
        generateValue: true

  # ─── Frontend (React + Vite) ────────────────────────────────────────────────
  - type: web
    name: ai-resume-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: VITE_API_URL
        sync: false          # Paste backend URL after backend deploys

